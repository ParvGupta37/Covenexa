# =============================================================
# Neo4j Community Edition — Covenexa Configuration
# =============================================================

# Server name for identification
server.default_advertised_address=neo4j

# ── MEMORY ───────────────────────────────────────────────────
# Heap is used for query execution and transaction state.
# Pagecache holds graph data in memory for fast traversal.
server.memory.heap.initial_size=512m
server.memory.heap.max_size=1G
server.memory.pagecache.size=512m

# ── CONNECTORS ───────────────────────────────────────────────
server.bolt.enabled=true
server.bolt.listen_address=0.0.0.0:7687
server.bolt.advertised_address=:7687

server.http.enabled=true
server.http.listen_address=0.0.0.0:7474
server.http.advertised_address=:7474

# Disable HTTPS for local development (enable in production)
server.https.enabled=false

# ── APOC PROCEDURES ──────────────────────────────────────────
# Required for advanced graph operations in later sprints.
dbms.security.procedures.unrestricted=apoc.*
dbms.security.procedures.allowlist=apoc.*

# ── TRANSACTION TIMEOUTS ─────────────────────────────────────
db.transaction.timeout=60s
db.lock.acquisition.timeout=10s

# ── LOGGING ──────────────────────────────────────────────────
server.logs.debug.enabled=false

# ── QUERY TUNING ─────────────────────────────────────────────
# Increase for complex Cypher traversals across knowledge graph
cypher.min_replan_interval=10s
db.query_cache_size=1000
